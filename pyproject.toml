[project]
name = "financial-risk-analyst-ml"
version = "0.1.0"
description = "Probability-of-default (PD) model for the Give Me Some Credit dataset, with SageMaker training and serving."
readme = "README.md"
authors = [
    { name = "adhvaith267", email = "adhvaith.gv@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "sagemaker>=2.231.0,<3.0.0",
    "botocore[crt]>=1.43.72",
    "scikit-learn>=1.2.0,<1.6.0",
    "pandas>=2.0.0,<3.0.0",
    "numpy>=1.24.0,<2.0.0",
    "joblib>=1.2.0",
    "xgboost>=2.0.0",
    "lightgbm>=4.0.0",
    "optuna>=3.6.0",
    "shap>=0.43.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
